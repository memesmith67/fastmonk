<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Table Page</title>
  <style>
    body {
      background-image: url('/hearts.gif');
      background-repeat: repeat;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      background-color: #e0f2fe; /* Baby blue */
      border: 3px solid #0369a1; /* Darker blue */
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    th, td {
      border: 1px solid #0369a1;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #bae6fd;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Memesmith X Janet</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>This page documents the romance between Janet and the meme smith.</td>
      </tr>
      <tr>
        <td><img src="janet.jpg">I <3 u memesmif!<img src="house.jpg">watever femoid...</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
